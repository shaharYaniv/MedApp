<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FDF8F4" />
  <meta name="description" content="Medi-Pal — Your calm, reliable medication companion." />
  <title>Medi-Pal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pill.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div id="app">
    <!-- Main content area — views render here -->
    <main id="app-content" role="main"></main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <a href="#dashboard" class="nav-item" data-view="dashboard" aria-label="Today's doses">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
        <span>Today</span>
      </a>

      <a href="#cabinet" class="nav-item" data-view="cabinet" aria-label="Medicine cabinet">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Cabinet</span>
      </a>

      <a href="#add-med" class="nav-item nav-item--fab" data-view="add-med" aria-label="Add medication">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </a>

      <a href="#inventory" class="nav-item" data-view="inventory" aria-label="Supply inventory">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>Supply</span>
      </a>

      <a href="#buddy" class="nav-item" data-view="buddy" aria-label="Buddy system">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Buddy</span>
      </a>
    </nav>
  </div>

  <!-- Toast container -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true"></div>

  <!-- Scripts — global namespace pattern (no ES modules, works over file://) -->
  <script defer src="js/utils/date.js"></script>
  <script defer src="js/utils/color.js"></script>
  <script defer src="js/utils/sms.js"></script>
  <script defer src="js/utils/notify.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/components/pill-renderer.js"></script>
  <script defer src="js/components/check-animation.js"></script>
  <script defer src="js/components/missed-dose-modal.js"></script>
  <script defer src="js/components/toast.js"></script>
  <script defer src="js/components/bottom-nav.js"></script>
  <script defer src="js/views/dashboard.js"></script>
  <script defer src="js/views/cabinet.js"></script>
  <script defer src="js/utils/drug-api.js"></script>
  <script defer src="js/views/add-med.js"></script>
  <script defer src="js/views/inventory.js"></script>
  <script defer src="js/views/buddy.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
